<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peminjaman Alat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Judul Website -->
    <header>
        <h1>Sistem Peminjaman Alat</h1>
    </header>

    <main>

        <!-- Form Peminjaman -->
        <section>
            <h2>Form Peminjaman</h2>

            <form id="form-peminjaman">

                <label for="nama-peminjam">Nama Peminjam</label>
                <input type="text" id="nama-peminjam"
                    placeholder="Masukkan nama" required>

                <label for="kelas">Kelas</label>
                <input type="text" id="kelas"
                    placeholder="Masukkan kelas" required>

                <label for="id-alat">Nama Alat</label>
                <select id="id-alat" required>
                    <option value="">Pilih alat</option>
                </select>

                <label for="jumlah">Jumlah</label>
                <input type="number" id="jumlah"
                    min="1" value="1" required>

                <label for="tanggal-pinjam">Tanggal Pinjam</label>
                <input type="date" id="tanggal-pinjam" required>

                <label for="tanggal-kembali">Tanggal Kembali</label>
                <input type="date" id="tanggal-kembali" required>

                <button type="submit">Ajukan Peminjaman</button>

            </form>
        </section>
        

        <section class="alat-section">
            <h2>Daftar Alat</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Alat</th>
                        <th>Kondisi</th>
                        <th>Stok</th>
                        <th>Lokasi</th>
                    </tr>
                </thead>

                <tbody id="alat-container">
                </tbody>
            </table>
        </section>

        <section>
            <h2>Data Peminjaman</h2>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Alat</th>
                        <th>Jumlah</th>
                        <th>Tanggal Pinjam</th>
                        <th>Tanggal Kembali</th>
                        <th>Status</th>
                        <th>Aksi</th>
                        
                    </tr>
                </thead>

                <tbody id="peminjaman-container">
                </tbody>
            </table>
        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
